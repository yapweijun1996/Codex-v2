<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Parser</title>
    <style>
        #preview {
            max-height: 400px;
            overflow: auto;
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
        }

        #preview th,
        #preview td {
            border: 1px solid #ccc;
            padding: 4px 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Excel Parser</h1>
    <input type="file" id="excelFile" accept=".xls,.xlsx,.xlsm,.csv" />
    <select id="sheetSelector"></select>
    <button id="parseBtn">Parse</button>
    <button id="exportBtn">Export CSV</button>
    <pre id="output"></pre>
    <div id="preview"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>
    <script>
        const outputEl = document.getElementById('output');
        const previewEl = document.getElementById('preview');
        const exportBtn = document.getElementById('exportBtn');
        const sheetSelector = document.getElementById('sheetSelector');
        let currentData = [];
        let currentHeaders = [];

        const columnKeyAliases = {
            project: ['project name', 'project title', 'proj', 'proj.', '项目', '项目名称'],
            project_code: ['project code', 'project no', 'project no.', 'proj code', 'proj no', 'proj no.', 'project id', 'proj id', '项目代码', '项目编号', '项目代号', '项目号'],
            month: ['for month of', 'month', 'month of', '月份', '期间', '月度'],
            item: ['item', '类别', '分项', '细项', '科目'],
            item_code: ['code', 'item code', 'item no', 'item no.', '编号', '代号', '代码', '项号'],
            description: ['description', 'desc', 'item description', '说明', '描述', '项目描述', '细项说明'],
            budget: ['budget', '总预算', '预算总额', '预算(总计)', '预算总计'],
            budget_original: ['original budget', 'budget original', 'budget (original)', 'original', '原始预算', '预算原始', '预算（原始）', '预算-原始'],
            budget_revised: ['revised budget', 'budget revised', 'budget (revised)', 'revised', '修订预算', '调整预算', '预算调整', '预算（调整）', '预算-调整'],
            budget_to_date: [
                'budget to date',
                'budget (to date)',
                'budget-to-date',
                'budget todate',
                'budget(todate)',
                'budget td',
                'budget_td',
                'budget ytd',
                'budget-ytd',
                '预算累计',
                '预算至今',
                '预算到期',
                '预算-累计',
                '预算（至今）',
                '预算ytd',
            ],
            committed: ['committed', 'commitment', 'commtd', '已承诺', '承诺金额', '承诺'],
            committed_to_date: [
                'committed to date',
                'committed (to date)',
                'committed-to-date',
                'committed todate',
                'committed(todate)',
                'commtd to date',
                'commtd-to-date',
                'commtd ytd',
                'committed ytd',
                '承诺累计',
                '承诺至今',
                '承诺-累计',
                '承诺ytd',
            ],
            certified: ['certified', 'cert', '已认证', '认证金额', '认证'],
            certified_to_date: [
                'certified to date',
                'certified (to date)',
                'certified-to-date',
                'certified todate',
                'certified(todate)',
                'cert to date',
                'cert-to-date',
                'cert ytd',
                'certified ytd',
                '认证累计',
                '认证至今',
                '认证-累计',
                '认证ytd',
            ],
            final: ['final', '最终', '终值'],
            final_forecast: ['final forecast', 'forecast final', 'final fcst', '最终预测', '最终预估', '最终预测值'],
            forecast: ['forecast', 'fcst', '预测', '预估', '预测值'],
            variance: ['variance', 'var', '差异', '差额', '偏差'],
            variance_forecast: ['variance forecast', 'forecast variance', 'variance fcst', '差异预测', '差异预估', '差额预测'],
            additional: ['additional', 'add', 'additional works', '额外', '附加'],
            remarks: ['remarks', 'remark', '备注', '说明'],
            remarks_previous: ['remarks_1', 'remarks (prev)', 'previous remarks', 'remarks prev', '上月备注', '备注(上月)', '备注-上月'],
            claim: ['claim', '索赔', '申索'],
        };

        const columnKeyMap = Object.entries(columnKeyAliases).reduce((map, [canonicalKey, aliases]) => {
            const aliasList = Array.isArray(aliases) ? aliases : [];
            const normalizedAliases = new Set([canonicalKey, ...aliasList]);

            normalizedAliases.forEach((alias) => {
                if (typeof alias !== 'string') {
                    return;
                }

                const normalizedAlias = alias.trim().toLowerCase();
                if (normalizedAlias !== '') {
                    map[normalizedAlias] = canonicalKey;
                }
            });

            return map;
        }, {});

        const getCanonicalKey = (key) => {
            if (typeof key !== 'string') {
                return key;
            }

            const trimmedKey = key.trim();
            if (trimmedKey === '') {
                return null;
            }

            const normalizedKey = trimmedKey.toLowerCase();
            return columnKeyMap[normalizedKey] || trimmedKey;
        };

        const numericPattern = /^-?(?:\d+(?:\.\d*)?|\.\d+)$/;

        const normalizeCellValue = (value) => {
            if (value === null || value === undefined) {
                return null;
            }

            if (typeof value === 'number') {
                return value;
            }

            if (typeof value !== 'string') {
                return value;
            }

            const trimmed = value.trim();
            if (trimmed === '') {
                return null;
            }

            const hasParentheses = /^\(.*\)$/.test(trimmed);
            const unwrappedValue = hasParentheses ? trimmed.slice(1, -1).trim() : trimmed;
            const withoutCurrency = unwrappedValue.replace(/[$,]/g, '');
            const cleanedCandidate = withoutCurrency.trim();

            if (cleanedCandidate === '') {
                return null;
            }

            const candidate = hasParentheses ? `-${cleanedCandidate}` : cleanedCandidate;

            if (numericPattern.test(candidate)) {
                const num = parseFloat(candidate);
                return Number.isNaN(num) ? null : num;
            }

            return trimmed;
        };

        const normalizeRow = (row) => {
            const normalizedRow = {};

            Object.entries(row).forEach(([key, value]) => {
                const canonicalKey = getCanonicalKey(key);
                if (canonicalKey === null || canonicalKey === undefined) {
                    return;
                }

                const normalizedValue = normalizeCellValue(value);

                if (normalizedRow[canonicalKey] === undefined) {
                    normalizedRow[canonicalKey] = normalizedValue;
                } else if (normalizedRow[canonicalKey] === null && normalizedValue !== null) {
                    normalizedRow[canonicalKey] = normalizedValue;
                }
            });

            return normalizedRow;
        };

        const populateSheetSelector = (sheetNames) => {
            const previousSelection = sheetSelector.value;

            sheetSelector.innerHTML = '';

            sheetNames.forEach((sheetName) => {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                sheetSelector.appendChild(option);
            });

            if (sheetNames.includes(previousSelection)) {
                sheetSelector.value = previousSelection;
            } else if (sheetNames.length > 0) {
                sheetSelector.value = sheetNames[0];
            }

            sheetSelector.disabled = sheetNames.length === 0;
        };

        sheetSelector.disabled = true;

        document.getElementById('parseBtn').onclick = () => {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];

            if (!file) {
                outputEl.textContent = 'Please select an Excel file first.';
                return;
            }

            currentData = [];
            currentHeaders = [];

            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                if (!workbook.SheetNames.length) {
                    outputEl.textContent = 'No sheets found in the workbook.';
                    return;
                }

                populateSheetSelector(workbook.SheetNames);

                const selectedSheetName = sheetSelector.value || workbook.SheetNames[0];
                const selectedSheet = workbook.Sheets[selectedSheetName];

                if (!selectedSheet) {
                    outputEl.textContent = `Sheet "${selectedSheetName}" not found in the workbook.`;
                    return;
                }

                const rawJsonData = XLSX.utils.sheet_to_json(selectedSheet, { defval: null });
                const normalizedData = rawJsonData.map(normalizeRow);

                outputEl.textContent = JSON.stringify(normalizedData, null, 2);
                console.log('Parsed JSON data:', normalizedData);

                previewEl.innerHTML = '';

                if (!normalizedData.length) {
                    return;
                }

                const headerSet = new Set();
                const headers = [];
                normalizedData.forEach((row) => {
                    Object.keys(row).forEach((key) => {
                        if (!headerSet.has(key)) {
                            headerSet.add(key);
                            headers.push(key);
                        }
                    });
                });
                currentHeaders = headers;
                currentData = normalizedData;

                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');

                headers.forEach((header) => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    headerRow.appendChild(th);
                });

                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                normalizedData.forEach((row) => {
                    const tr = document.createElement('tr');

                    headers.forEach((header) => {
                        const td = document.createElement('td');
                        const value = row[header];
                        td.textContent = value === null || value === undefined ? '' : value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                previewEl.appendChild(table);
            };
            reader.onerror = () => {
                outputEl.textContent = 'Failed to read the file.';
            };

            reader.readAsArrayBuffer(file);
        };

        const escapeCsvValue = (value) => {
            if (value === null || value === undefined) {
                return '';
            }

            const stringValue = String(value);
            if (/[",\n]/.test(stringValue)) {
                return `"${stringValue.replace(/"/g, '""')}"`;
            }

            return stringValue;
        };

        exportBtn.onclick = () => {
            if (!currentData.length || !currentHeaders.length) {
                outputEl.textContent = 'Please parse an Excel file before exporting.';
                return;
            }

            const csvRows = [currentHeaders.map(escapeCsvValue).join(',')];

            currentData.forEach((row) => {
                const csvRow = currentHeaders.map((header) => escapeCsvValue(row[header]));
                csvRows.push(csvRow.join(','));
            });

            const csvString = csvRows.join('\r\n');
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'converted.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
