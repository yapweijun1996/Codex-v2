<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Parser</title>
    <style>
        #preview {
            max-height: 400px;
            overflow: auto;
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
        }

        #preview th,
        #preview td {
            border: 1px solid #ccc;
            padding: 4px 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Excel Parser</h1>
    <input type="file" id="excelFile" accept=".xls,.xlsx,.xlsm,.csv" />
    <button id="parseBtn">Parse</button>
    <button id="exportBtn">Export CSV</button>
    <pre id="output"></pre>
    <div id="preview"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>
    <script>
        const outputEl = document.getElementById('output');
        const previewEl = document.getElementById('preview');
        const exportBtn = document.getElementById('exportBtn');
        let currentData = [];
        let currentHeaders = [];

        document.getElementById('parseBtn').onclick = () => {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];

            if (!file) {
                outputEl.textContent = 'Please select an Excel file first.';
                return;
            }

            currentData = [];
            currentHeaders = [];

            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                if (!workbook.SheetNames.length) {
                    outputEl.textContent = 'No sheets found in the workbook.';
                    return;
                }

                const firstSheetName = workbook.SheetNames[0];
                const firstSheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: null });

                outputEl.textContent = JSON.stringify(jsonData, null, 2);
                console.log('Parsed JSON data:', jsonData);

                previewEl.innerHTML = '';

                if (!jsonData.length) {
                    return;
                }

                const headers = Array.from(jsonData.reduce((set, row) => {
                    Object.keys(row).forEach((key) => set.add(key));
                    return set;
                }, new Set()));
                currentHeaders = headers;
                currentData = jsonData;

                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');

                headers.forEach((header) => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    headerRow.appendChild(th);
                });

                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                jsonData.forEach((row) => {
                    const tr = document.createElement('tr');

                    headers.forEach((header) => {
                        const td = document.createElement('td');
                        const value = row[header];
                        td.textContent = value === null || value === undefined ? '' : value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                previewEl.appendChild(table);
            };
            reader.onerror = () => {
                outputEl.textContent = 'Failed to read the file.';
            };

            reader.readAsArrayBuffer(file);
        };

        const escapeCsvValue = (value) => {
            if (value === null || value === undefined) {
                return '';
            }

            const stringValue = String(value);
            if (/[",\n]/.test(stringValue)) {
                return `"${stringValue.replace(/"/g, '""')}"`;
            }

            return stringValue;
        };

        exportBtn.onclick = () => {
            if (!currentData.length || !currentHeaders.length) {
                outputEl.textContent = 'Please parse an Excel file before exporting.';
                return;
            }

            const csvRows = [currentHeaders.map(escapeCsvValue).join(',')];

            currentData.forEach((row) => {
                const csvRow = currentHeaders.map((header) => escapeCsvValue(row[header]));
                csvRows.push(csvRow.join(','));
            });

            const csvString = csvRows.join('\r\n');
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'converted.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
