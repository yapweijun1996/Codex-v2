<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Parser</title>
    <style>
        #preview {
            max-height: 400px;
            overflow: auto;
        }

        #preview table {
            border-collapse: collapse;
            width: 100%;
        }

        #preview th,
        #preview td {
            border: 1px solid #ccc;
            padding: 4px 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Excel Parser</h1>
    <input type="file" id="excelFile" accept=".xls,.xlsx,.xlsm,.csv" />
    <select id="sheetSelector"></select>
    <button id="parseBtn">Parse</button>
    <button id="exportBtn">Export CSV</button>
    <pre id="output"></pre>
    <div id="preview"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>
    <script>
        const outputEl = document.getElementById('output');
        const previewEl = document.getElementById('preview');
        const exportBtn = document.getElementById('exportBtn');
        const sheetSelector = document.getElementById('sheetSelector');
        let currentData = [];
        let currentHeaders = [];

        const columnKeyMap = {
            project: 'project',
            'project name': 'project',
            budget: 'budget',
            committed: 'committed',
        };

        const getCanonicalKey = (key) => {
            if (typeof key !== 'string') {
                return key;
            }

            const trimmedKey = key.trim();
            if (trimmedKey === '') {
                return null;
            }

            const normalizedKey = trimmedKey.toLowerCase();
            return columnKeyMap[normalizedKey] || trimmedKey;
        };

        const numericPattern = /^-?(?:\d+(?:\.\d*)?|\.\d+)$/;

        const normalizeCellValue = (value) => {
            if (value === null || value === undefined) {
                return null;
            }

            if (typeof value === 'number') {
                return value;
            }

            if (typeof value !== 'string') {
                return value;
            }

            const trimmed = value.trim();
            if (trimmed === '') {
                return null;
            }

            const hasParentheses = /^\(.*\)$/.test(trimmed);
            const unwrappedValue = hasParentheses ? trimmed.slice(1, -1).trim() : trimmed;
            const withoutCurrency = unwrappedValue.replace(/[$,]/g, '');
            const cleanedCandidate = withoutCurrency.trim();

            if (cleanedCandidate === '') {
                return null;
            }

            const candidate = hasParentheses ? `-${cleanedCandidate}` : cleanedCandidate;

            if (numericPattern.test(candidate)) {
                const num = parseFloat(candidate);
                return Number.isNaN(num) ? null : num;
            }

            return trimmed;
        };

        const normalizeRow = (row) => {
            const normalizedRow = {};

            Object.entries(row).forEach(([key, value]) => {
                const canonicalKey = getCanonicalKey(key);
                if (canonicalKey === null || canonicalKey === undefined) {
                    return;
                }

                const normalizedValue = normalizeCellValue(value);

                if (normalizedRow[canonicalKey] === undefined) {
                    normalizedRow[canonicalKey] = normalizedValue;
                } else if (normalizedRow[canonicalKey] === null && normalizedValue !== null) {
                    normalizedRow[canonicalKey] = normalizedValue;
                }
            });

            return normalizedRow;
        };

        const populateSheetSelector = (sheetNames) => {
            const previousSelection = sheetSelector.value;

            sheetSelector.innerHTML = '';

            sheetNames.forEach((sheetName) => {
                const option = document.createElement('option');
                option.value = sheetName;
                option.textContent = sheetName;
                sheetSelector.appendChild(option);
            });

            if (sheetNames.includes(previousSelection)) {
                sheetSelector.value = previousSelection;
            } else if (sheetNames.length > 0) {
                sheetSelector.value = sheetNames[0];
            }

            sheetSelector.disabled = sheetNames.length === 0;
        };

        sheetSelector.disabled = true;

        document.getElementById('parseBtn').onclick = () => {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];

            if (!file) {
                outputEl.textContent = 'Please select an Excel file first.';
                return;
            }

            currentData = [];
            currentHeaders = [];

            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                if (!workbook.SheetNames.length) {
                    outputEl.textContent = 'No sheets found in the workbook.';
                    return;
                }

                populateSheetSelector(workbook.SheetNames);

                const selectedSheetName = sheetSelector.value || workbook.SheetNames[0];
                const selectedSheet = workbook.Sheets[selectedSheetName];

                if (!selectedSheet) {
                    outputEl.textContent = `Sheet "${selectedSheetName}" not found in the workbook.`;
                    return;
                }

                const rawJsonData = XLSX.utils.sheet_to_json(selectedSheet, { defval: null });
                const normalizedData = rawJsonData.map(normalizeRow);

                outputEl.textContent = JSON.stringify(normalizedData, null, 2);
                console.log('Parsed JSON data:', normalizedData);

                previewEl.innerHTML = '';

                if (!normalizedData.length) {
                    return;
                }

                const headerSet = new Set();
                const headers = [];
                normalizedData.forEach((row) => {
                    Object.keys(row).forEach((key) => {
                        if (!headerSet.has(key)) {
                            headerSet.add(key);
                            headers.push(key);
                        }
                    });
                });
                currentHeaders = headers;
                currentData = normalizedData;

                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');

                headers.forEach((header) => {
                    const th = document.createElement('th');
                    th.textContent = header;
                    headerRow.appendChild(th);
                });

                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                normalizedData.forEach((row) => {
                    const tr = document.createElement('tr');

                    headers.forEach((header) => {
                        const td = document.createElement('td');
                        const value = row[header];
                        td.textContent = value === null || value === undefined ? '' : value;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                previewEl.appendChild(table);
            };
            reader.onerror = () => {
                outputEl.textContent = 'Failed to read the file.';
            };

            reader.readAsArrayBuffer(file);
        };

        const escapeCsvValue = (value) => {
            if (value === null || value === undefined) {
                return '';
            }

            const stringValue = String(value);
            if (/[",\n]/.test(stringValue)) {
                return `"${stringValue.replace(/"/g, '""')}"`;
            }

            return stringValue;
        };

        exportBtn.onclick = () => {
            if (!currentData.length || !currentHeaders.length) {
                outputEl.textContent = 'Please parse an Excel file before exporting.';
                return;
            }

            const csvRows = [currentHeaders.map(escapeCsvValue).join(',')];

            currentData.forEach((row) => {
                const csvRow = currentHeaders.map((header) => escapeCsvValue(row[header]));
                csvRows.push(csvRow.join(','));
            });

            const csvString = csvRows.join('\r\n');
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'converted.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
