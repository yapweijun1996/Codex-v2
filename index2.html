<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Text Converter</title>
  <style>
    /* -----------------------------------------------------
     * Design Tokens
     * ----------------------------------------------------- */
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --border: #d1d5db;
      --border-strong: #9ca3af;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #166534;
      --error: #b91c1c;
    }

    /* -----------------------------------------------------
     * Layout
     * ----------------------------------------------------- */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 5vw, 32px);
      box-sizing: border-box;
      line-height: 1.5;
    }

    .app {
      max-width: 1000px;
      width: 100%;
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      padding: clamp(1.5rem, 5vw, 2.75rem);
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
    }

    .status {
      min-height: 24px;
      font-size: 0.95rem;
      color: var(--muted);
      word-break: break-word;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .status.info { color: var(--primary-dark); }

    /* -----------------------------------------------------
     * Controls
     * ----------------------------------------------------- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      justify-content: space-between;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 200px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="number"] {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      width: 180px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #d1d5db;
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(148, 163, 184, 0.35);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* -----------------------------------------------------
     * Text Areas
     * ----------------------------------------------------- */
    .panes {
      display: grid;
      gap: 24px;
    }

    @media (min-width: 960px) {
      .panes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    textarea {
      width: 100%;
      min-height: 320px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
      resize: vertical;
      font-family: "SFMono-Regular", ui-monospace, "Roboto Mono", Menlo, monospace;
      font-size: 0.95rem;
      background: #f9fafb;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      background: #fff;
    }

    .pane-title {
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* -----------------------------------------------------
     * Responsive tweaks
     * ----------------------------------------------------- */
    @media (max-width: 900px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .control-group,
      .button-group,
      input[type="number"],
      button {
        width: 100%;
      }
      .button-group {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      textarea { min-height: 260px; }
      .panes { gap: 16px; }
      header { text-align: left; }
    }

    @media (max-width: 480px) {
      .app {
        padding: 1.5rem;
        border-radius: 14px;
      }
      button { min-height: 48px; }
      .status { font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header>
      <h1 id="app-title">CSV Text Converter</h1>
      <p id="status" class="status info">Paste CSV text into the left panel to get started.</p>
    </header>

    <section class="controls" aria-label="Conversion controls">
      <div class="control-group">
        <label for="headerRow">Header Row (optional, 1-based)</label>
        <input type="number" id="headerRow" min="1" placeholder="Auto-detect" />
      </div>
      <div class="button-group">
        <button id="convertBtn" class="btn-primary" type="button">Convert</button>
        <button id="downloadBtn" class="btn-secondary" type="button" disabled>Download CSV</button>
      </div>
    </section>

    <section class="panes" aria-label="Input and output panels">
      <article>
        <h2 class="pane-title">Input CSV</h2>
        <textarea id="inputCsv" placeholder="Paste raw CSV text here..." aria-label="Input CSV text"></textarea>
      </article>
      <article>
        <h2 class="pane-title">Converted CSV</h2>
        <textarea id="outputCsv" readonly placeholder="Converted schema will appear here..." aria-label="Converted CSV text"></textarea>
      </article>
    </section>
  </main>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="js/parser.js"></script>
  <script>
    (function bootstrapCsvTextConverter() {
      'use strict';

      const parser = window.csvParser;
      if (!parser || typeof parser.parse !== 'function') {
        console.error('csvParser module is required but missing.');
        return;
      }

      const dom = {
        input: document.getElementById('inputCsv'),
        output: document.getElementById('outputCsv'),
        convertBtn: document.getElementById('convertBtn'),
        downloadBtn: document.getElementById('downloadBtn'),
        headerRow: document.getElementById('headerRow'),
        status: document.getElementById('status')
      };

      const state = { convertedCsv: '' };

      function setStatus(message, tone = 'info') {
        dom.status.textContent = message;
        dom.status.className = `status ${tone}`;
      }

      function parseHeaderOverride() {
        const value = dom.headerRow.value.trim();
        if (!value) return null;
        const parsed = Number.parseInt(value, 10);
        if (Number.isNaN(parsed) || parsed <= 0) {
          throw new Error('Header Row must be a positive number.');
        }
        return parsed;
      }

      function escapeCell(value) {
        if (value === null || typeof value === 'undefined') return '';
        const text = String(value);
        return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }

      function buildCsv(headers, rows) {
        const lines = [headers.join(',')];
        rows.forEach((row) => {
          const line = headers.map((header) => escapeCell(row[header]));
          lines.push(line.join(','));
        });
        return lines.join('\n');
      }

      function convertInputCsv() {
        const rawCsv = dom.input.value.trim();
        if (!rawCsv) {
          state.convertedCsv = '';
          dom.output.value = '';
          dom.downloadBtn.disabled = true;
          setStatus('Please paste CSV text before converting.', 'error');
          return;
        }

        let headerOverride = null;
        try {
          headerOverride = parseHeaderOverride();
        } catch (error) {
          setStatus(error.message, 'error');
          return;
        }

        try {
          const { headers, data } = parser.parse(rawCsv, headerOverride);
          if (!headers.length || !data.length) {
            const headerLine = headers.join(',');
            dom.output.value = headerLine;
            state.convertedCsv = headerLine;
            dom.downloadBtn.disabled = false;
            setStatus('Conversion succeeded but produced no rows. Verify the input.', 'info');
            return;
          }

          state.convertedCsv = buildCsv(headers, data);
          dom.output.value = state.convertedCsv;
          dom.downloadBtn.disabled = false;
          setStatus(`Converted ${data.length} rows across ${headers.length} columns.`, 'success');
        } catch (error) {
          console.error('Conversion failed', error);
          state.convertedCsv = '';
          dom.output.value = '';
          dom.downloadBtn.disabled = true;
          setStatus(`Conversion error: ${error.message}`, 'error');
        }
      }

      function downloadConvertedCsv() {
        if (!state.convertedCsv) return;
        const blob = new Blob([state.convertedCsv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'converted.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setStatus('Converted CSV downloaded.', 'success');
      }

      dom.convertBtn.addEventListener('click', convertInputCsv);
      dom.downloadBtn.addEventListener('click', downloadConvertedCsv);
      dom.input.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          event.preventDefault();
          convertInputCsv();
        }
      });
    })();
  </script>
</body>
</html>
